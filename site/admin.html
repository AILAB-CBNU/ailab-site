<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웹사이트 관리자 · CBNU AI Lab</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/admin.css?v=20260922-3">
</head>
<body>
  <main class="login-wrap" id="login-view">
    <section class="login-card" aria-labelledby="login-title">
      <a class="admin-brand" href="index.html"><span class="brand-mark">✦</span> CBNU AI Lab</a>
      <p class="eyebrow">WEBSITE ADMIN</p>
      <h1 id="login-title">관리자 로그인</h1>
      <p class="login-copy">연구실 홈페이지의 텍스트와 링크를 관리합니다.</p>
      <div class="setup-note" id="setup-note" hidden>
        서버 PC에서 <strong>08-SET-ADMIN-PASSWORD.bat</strong>를 먼저 실행해 관리자 비밀번호를 설정하세요.
      </div>
      <form id="login-form">
        <label for="admin-password">비밀번호</label>
        <input id="admin-password" name="password" type="password" minlength="12" autocomplete="current-password" required>
        <button class="primary" type="submit">로그인</button>
      </form>
      <p class="form-message" id="login-message" role="status"></p>
      <a class="back-link" href="index.html">← 홈페이지로 돌아가기</a>
    </section>
  </main>

  <div class="admin-app" id="editor-view" hidden>
    <header class="topbar">
      <div>
        <a class="admin-brand" href="index.html"><span class="brand-mark">✦</span> CBNU AI Lab</a>
        <span class="admin-label">관리자</span>
      </div>
      <div class="top-actions">
        <a id="open-page" href="index.html" target="_blank" rel="noopener">페이지 열기 ↗</a>
        <button class="quiet" id="logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <p class="side-title">편집 영역</p>
        <nav id="page-list" aria-label="관리할 페이지"></nav>
        <div class="language-box">
          <span>언어</span>
          <div class="segmented" role="group" aria-label="편집 언어">
            <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
            <button type="button" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
      </aside>

      <section class="editor-panel">
        <div class="editor-toolbar">
          <div>
            <p class="eyebrow" id="section-eyebrow">COMMON</p>
            <h1 id="section-title">헤더·푸터</h1>
            <p id="section-description">모든 페이지에 공통으로 표시되는 텍스트와 링크입니다.</p>
          </div>
          <div class="save-area">
            <span id="save-status" role="status">저장된 상태</span>
            <button class="primary" id="save-button" type="button" disabled>변경사항 저장</button>
          </div>
        </div>

        <div class="editor-grid">
          <section class="fields-pane" aria-label="텍스트 편집 필드">
            <div class="field-tools">
              <input id="field-search" type="search" placeholder="현재 텍스트나 링크 검색">
              <span id="field-count"></span>
            </div>
            <div class="loading-state" id="loading-state">페이지에서 편집 항목을 불러오는 중입니다.</div>
            <div id="field-list"></div>
          </section>
          <section class="preview-pane" aria-label="페이지 미리보기">
            <div class="preview-label"><span class="live-dot"></span> 실시간 미리보기</div>
            <iframe id="page-preview" title="편집할 페이지 미리보기"></iframe>
          </section>
        </div>
      </section>
    </div>
  </div>
  <script src="js/admin.js?v=20260922-3"></script>
</body>
</html>
